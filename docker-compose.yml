services:
  postgres:
    image: postgres:17-alpine
    container_name: chargemesh-postgres
    environment:
      POSTGRES_USER: chargemesh
      POSTGRES_PASSWORD: chargemesh
      POSTGRES_DB: chargemesh
    ports:
      - "5433:5432"
    volumes:
      - chargemesh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargemesh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chargemesh-pgdata:
