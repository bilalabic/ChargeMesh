[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Monad verification guidance: no IPFS metadata hash, embed literal sources.
bytecode_hash = "none"
cbor_metadata = true
use_literal_content = true
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 512

[rpc_endpoints]
anvil = "http://localhost:8545"
monad_testnet = "https://testnet-rpc.monad.xyz"
